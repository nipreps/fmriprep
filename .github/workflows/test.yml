name: Stable tests

on:
  push:
    branches:
      - master
      - main
      - maint/*
  pull_request:
    branches:
      - master
      - main
      - maint/*

defaults:
  run:
    shell: bash

# Force pixi and pytest to use color
env:
  FORCE_COLOR: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Check minimum versions, production pins and newer Python versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ["test", "min", "py313", "py314"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/templateflow
          key: templateflow-v1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.78.0
          environments: ${{ matrix.environment }}
          locked: true
      - name: Display Python version
        run: pixi run -e ${{ matrix.environment }} python -c "import sys; print(sys.version)"
      - name: Run test suite
        run: pixi run -e ${{ matrix.environment }} test
        timeout-minutes: 20
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ always() }}
