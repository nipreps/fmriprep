version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
  jobs:
    # Install the "doc" dependency group (RTD has no native support yet)
    post_install:
      - python -m pip install --group doc .
    post_checkout:
      - git fetch --unshallow

python:
  install:
    - requirements: docs/requirements.txt
    - path: .
    - path: wrapper/

sphinx:
  configuration: docs/conf.py
